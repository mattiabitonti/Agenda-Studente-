<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>📘 Agenda Studente 👨🏼‍🎓</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main>
    <section id="header">
      <header><h1>📘 Agenda Studente 👨🏼‍🎓</h1></header>
    </section>

    <section id="login">
      <h2>BENVENUTO 👋</h2>
      <p>Accedi per visualizzare l'agenda</p>
      <input type="text" id="username" placeholder="Nome utente">
      <input type="password" id="password" placeholder="Password">
      <button id="loginBtn">Entra</button>
    </section>

    <section id="agenda" style="display:none;">

      <div class="tab-buttons">
        <button data-tab="orario" class="active">Orario</button>
        <button data-tab="compiti">Compiti</button>
        <button data-tab="appunti">Appunti</button>
        <button id="logout" style="float:right;background:#d9534f;">Esci</button>
      </div>

      <!-- ORARIO -->
      <section id="orario" class="tab-content active">
        <h2>Orario scolastico</h2>
        <table id="tabellaOrario">
          <thead>
            <tr>
              <th>Ora</th>
              <th>Lunedì</th>
              <th>Martedì</th>
              <th>Mercoledì</th>
              <th>Giovedì</th>
              <th>Venerdì</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <button onclick="salvaOrario()">💾 Salva orario</button>
      </section>

      <!-- COMPITI -->
      <section id="compiti" class="tab-content">
        <h2>Compiti</h2>
        <form id="formCompiti">

          <select id="materiaCompiti">
            <option value="">Materia...</option>
            <option>Italiano</option>
            <option>Matematica</option>
            <option>Inglese</option>
            <option>Informatica</option>
            <option>Educazione fisica</option>
            <option>Religione</option>
          </select>

          <input type="text" id="compito" placeholder="Descrizione compito...">
          <button type="submit">➕ Aggiungi</button>
        </form>
        <ul id="listaCompiti"></ul>
      </section>

      <!-- APPUNTI -->
      <section id="appunti" class="tab-content">
        <h2>Appunti</h2>
        <form id="formAppunti">

          <select id="materiaAppunti">
            <option value="">Materia...</option>
            <option>Italiano</option>
            <option>Matematica</option>
            <option>Inglese</option>
            <option>Informatica</option>
            <option>Educazione fisica</option>
            <option>Religione</option>
          </select>

          <input type="text" id="appunto" placeholder="Aggiungi un appunto...">
          <button type="submit">💾 Salva</button>
        </form>
        <ul id="listaAppunti"></ul>
      </section>

    </section>
  </main>

  <footer><p>© 2025 - Agenda Studente Locale</p></footer>

  <script src="script.js"></script>
</body>
</html>
